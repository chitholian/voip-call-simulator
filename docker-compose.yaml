services:
  callee:
    profiles: [callee]
    build: ./asterisk
    image: chitholian/voip-call-simulator
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    network_mode: host
    stop_grace_period: 6m
    env_file:
      - .env
    environment:
      MODE: callee
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./cdr/callee:/var/log/asterisk

  caller:
    profiles: [caller]
    build: ./asterisk
    image: chitholian/voip-call-simulator
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    network_mode: host
    stop_grace_period: 6m
    env_file:
      - .env
    environment:
      MODE: caller
      SIP_PORT: 7060
      AMI_PORT: 7038
      FASTAGI_PORT: 5573
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./cdr/caller:/var/log/asterisk
