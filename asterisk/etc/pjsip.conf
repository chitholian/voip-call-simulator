; Transports are rendered at runtime by entrypoint.sh into
; /var/lib/asterisk/pjsip-transport.conf (port from SIP_PORT env).
; The inbound (callee) [anonymous] endpoint is rendered at runtime by
; entrypoint.sh into /var/lib/asterisk/pjsip-anonymous.conf. It carries the
; CALLEE_ALLOW_IPS source-IP whitelist (deny-all + permit-listed) when set.
#include /var/lib/asterisk/pjsip-transport.conf
#include /var/lib/asterisk/pjsip-anonymous.conf

; Outbound (caller) endpoint is rendered at runtime by entrypoint.sh into
; /var/lib/asterisk/pjsip-caller.conf (peer host/port from env).
#tryinclude /var/lib/asterisk/pjsip-caller.conf
