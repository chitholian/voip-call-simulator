[general]
static=yes
writeprotect=no
clearglobalvars=no
priorityjumping=no

; === CALLER mode outgoing-sim context ===
; AMI originates Local/s@caller; [caller] Dials out with random ring window.
[caller]
exten => s,1,NoOp(CALLER-SIM start peer=${DIALSTR})
 same => n,Dial(PJSIP/${DIALSTR},${RING_TIMEOUT_MS},rB(caller_talk^s^1))
 same => n,NoOp(CALLER-SIM outcome=${DIALSTATUS} answeredtime=${ANSWEREDTIME})
 same => n,Hangup()

; New outbound-sim hop (used by AMI Originate via Local channel).
; AMI originates Local/{n}@caller-dial/n with CallerID=<random>. This context
; re-Dials out through caller-out so the channel's CallerID is honored by
; PJSIP (direct-originate-to-endpoint ignored the Originate CallerID when the
; endpoint had no callerid configured -> empty From in CDR).
[caller-dial]
exten => _X.,1,NoOp(CALLER-DIAL to ${EXTEN} from ${CALLERID(all)} mycid=${MYCALLERID})
 same => n,Set(CALLERID(all)=${MYCALLERID})
 same => n,Dial(PJSIP/${EXTEN}@caller-out)
 same => n,NoOp(CALLER-DIAL outcome=${DIALSTATUS} answeredtime=${ANSWEREDTIME})
 same => n,Hangup()

; Runs on the outbound leg after answer (Dial option B):
; caller 'talks' = streams random core-sound files for a random duration.
[caller_talk]
exten => s,1,AGI(sim_caller_media.py)
 same => n,Hangup()

; === CALLEE mode human-like context ===
; Anonymous endpoint sends inbound calls here. AGI controls answer timing.
[callee]
exten => _X.,1,NoOp(CALLEE-SIM call from ${CALLERID(all)} to ${EXTEN})
 same => n,AGI(sim_callee.py)
 same => n,Hangup()
